<!DOCTYPE html>
<html>
<head>
  <title>Live Webinar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin:0; text-align:center; background:black; }
    #image { width:100%; height:100vh; object-fit:cover; }
    #timer { position:absolute; top:20px; width:100%; color:white; font-size:24px; font-weight:bold; }
    iframe { width:100%; height:100vh; border:none; display:none; }
  </style>
</head>

<body>

<!-- Image -->
<img id="image" src="https://storage.files-vault.com/uploads/1772218855-3YhJGpKaeF.png">

<!-- Timer -->
<div id="timer"></div>

<!-- Video -->
<iframe id="video" 
src="https://drive.google.com/file/d/1Dkk-m2s7emcIwjwrrBDkgJRIvf-Xczhx/preview?autoplay=1">
</iframe>

<!-- Background Music -->
<audio id="bgmusic" autoplay loop muted>
  <source src="https://files.catbox.moe/21z7c9.mp3" type="audio/mp3">
</audio>

<script>

let started = false;

// autoplay unmute trick
setTimeout(()=>{
  let music = document.getElementById("bgmusic");
  music.muted = false;
  music.play().catch(()=>{});
}, 2000);

function updateTimer(){
  let now = new Date();
  let target = new Date();

  target.setHours(19,0,0,0);

  if(now > target){
    target.setDate(target.getDate() + 1);
  }

  let diff = target - now;

  let h = Math.floor(diff/1000/60/60);
  let m = Math.floor(diff/1000/60 % 60);
  let s = Math.floor(diff/1000 % 60);

  document.getElementById("timer").innerHTML =
    "Next Live Session: Today at 7 PM<br>" + h+"h "+m+"m "+s+"s";

  if(now.getHours()==19 && !started){
    started = true;

    document.getElementById("image").style.display="none";
    document.getElementById("video").style.display="block";

    // stop music
    document.getElementById("bgmusic").pause();

    // redirect after video (22 min 4 sec)
    setTimeout(()=>{
      window.location.href="https://wa.me/919827911180?text=Hello%20sir,%20mu%20apananka%20webinar%20dekhiki%20asichi%20🙏%20Mate%20CSC%20join%20karibara%20achi.%20Please%20guide%20karantu";
    }, 1324000);
  }
}

setInterval(updateTimer,1000);

</script>

</body>
</html>
